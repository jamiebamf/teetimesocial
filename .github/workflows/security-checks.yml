name: Security checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-admin-auth:
    name: Admin auth and secret regression checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tts_security
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tts_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: tts_security
      PGUSER: postgres
      PGPASSWORD: ${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for committed secrets
        run: npm run check:secrets

      - name: Run authentication regression tests
        run: npm test

      - name: Execute PostgreSQL authorization test
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260906221500_tts_admin_server_authorization.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/admin_authorization.sql
